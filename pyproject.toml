[project]
name = "voiceprobe"
version = "0.0.1"
description = "Unit tests for voice agents."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voiceprobe = "voiceprobe.cli:main"

[tool.setuptools.packages.find]
include = ["voiceprobe*"]